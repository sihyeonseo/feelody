<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Feelody · 세 곡</title><style>body{font:17px/1.6 system-ui;background:#f3f5ee;color:#173d39;max-width:700px;margin:8vh auto;padding:20px}main{background:#fff;padding:26px;border-radius:16px}textarea{width:100%;box-sizing:border-box;padding:12px;font:inherit}button{background:#24534e;color:white;border:0;padding:10px 16px;border-radius:8px;font:inherit;margin:8px 0}li{padding:6px}small{letter-spacing:.08em}a{color:#24534e}</style><main><small>F E E L O D Y</small><h1>오늘의 일기, 세 곡</h1><form><label for="diary">오늘은 어떤 마음이었어?</label><textarea required maxlength="4000" id="diary" rows="6"></textarea><button>세 곡 추천받기</button></form><p id="status" role="status"></p><ol></ol></main><script>
const form=document.querySelector('form'), button=form.querySelector('button'), list=document.querySelector('ol'), msg=document.querySelector('#status');
form.onsubmit=async e=>{e.preventDefault();const diary=document.querySelector('#diary').value.trim();if(!diary)return;button.disabled=true;list.replaceChildren();msg.textContent='곡을 찾고 있어…';try{const r=await fetch('/api/recommend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({diary})});if(!r.ok)throw Error();const data=await r.json();for(const s of data.songs){const li=document.createElement('li'),a=document.createElement('a');a.href='https://www.melon.com/song/detail.htm?songId='+encodeURIComponent(s.song_id);a.textContent=s.title+' · '+s.artist;a.target='_blank';a.rel='noreferrer';li.append(a);list.append(li)}msg.textContent='추천 순서';}catch{msg.textContent='추천을 완료하지 못했어. 실행 창을 확인해 줘.'}finally{button.disabled=false}};
</script></html>
